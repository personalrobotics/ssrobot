<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" role="img" aria-labelledby="title desc">
  <title id="title">A robot context binds one robot description to one runtime</title>
  <desc id="desc">A robot package produces a stable RobotDescription. RobotContext combines that description with exactly one runtime and presents one session to an application. Snapshots and traces leave the context as evidence. MuJoCo and replay are available runtimes, while hardware is planned.</desc>
  <defs>
    <marker id="arrow-ink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#0f766e"/>
    </marker>
    <style>
      .eyebrow { font: 600 11.5px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; letter-spacing: 1px; fill: #64748b; }
      .label { font: 600 16px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #17212b; }
      .body { font: 400 13.5px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #475569; }
      .small { font: 500 12.5px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #5c6773; }
      .code { font: 600 16px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #17212b; }
    </style>
  </defs>

  <rect width="400" height="600" rx="18" fill="#fafaf7"/>

  <text x="200" y="28" text-anchor="middle" class="eyebrow">STABLE ROBOT MEANING</text>
  <rect x="20" y="40" width="360" height="62" rx="12" fill="#e8f0f6" stroke="#2f5d7e" stroke-width="2"/>
  <text x="200" y="66" text-anchor="middle" class="code">Robot package</text>
  <text x="200" y="88" text-anchor="middle" class="body">models · semantics · capabilities · resources</text>
  <path d="M106 102 L106 124" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-ink)"/>

  <rect x="20" y="130" width="172" height="76" rx="12" fill="#e8f0f6" stroke="#2f5d7e" stroke-width="2"/>
  <text x="106" y="164" text-anchor="middle" class="code">RobotDescription</text>
  <text x="106" y="187" text-anchor="middle" class="body">what the robot is</text>

  <rect x="208" y="130" width="172" height="76" rx="12" fill="#eeeaf8" stroke="#6d5aae" stroke-width="2"/>
  <text x="294" y="151" text-anchor="middle" class="eyebrow">DECISION SOURCE</text>
  <text x="294" y="174" text-anchor="middle" class="label">Application</text>
  <text x="294" y="195" text-anchor="middle" class="small">planner · policy · operator</text>

  <path d="M106 206 L106 236" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <path d="M284 206 L284 236" fill="none" stroke="#6d5aae" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <path d="M304 240 L304 210" fill="none" stroke="#6d5aae" stroke-width="2" marker-end="url(#arrow-ink)"/>

  <rect x="20" y="244" width="360" height="96" rx="14" fill="#e3f3f0" stroke="#0f766e" stroke-width="2.5"/>
  <text x="200" y="270" text-anchor="middle" class="eyebrow">LIVE SESSION BOUNDARY</text>
  <text x="200" y="296" text-anchor="middle" class="code">RobotContext</text>
  <text x="200" y="320" text-anchor="middle" class="body">world · lifecycle · ownership · evidence</text>

  <path d="M100 340 L100 368" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <path d="M300 340 L300 368" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <rect x="20" y="374" width="160" height="62" rx="12" fill="#edf1f5" stroke="#64748b" stroke-width="2"/>
  <text x="100" y="400" text-anchor="middle" class="label">Snapshots</text>
  <text x="100" y="422" text-anchor="middle" class="small">immutable planning state</text>
  <rect x="220" y="374" width="160" height="62" rx="12" fill="#edf1f5" stroke="#64748b" stroke-width="2"/>
  <text x="300" y="400" text-anchor="middle" class="label">Trace</text>
  <text x="300" y="422" text-anchor="middle" class="small">causal execution record</text>

  <path d="M200 500 L200 344" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <rect x="88" y="454" width="224" height="20" fill="#fafaf7"/>
  <text x="200" y="468" text-anchor="middle" class="eyebrow" fill="#b45309">CHOOSE EXACTLY ONE RUNTIME</text>

  <path d="M78 518 C78 502 150 500 192 500" fill="none" stroke="#b45309" stroke-width="2"/>
  <path d="M200 518 L200 500" fill="none" stroke="#b45309" stroke-width="2"/>
  <path d="M322 518 C322 502 250 500 208 500" fill="none" stroke="#b8a792" stroke-width="2" stroke-dasharray="6 5"/>

  <rect x="20" y="518" width="116" height="62" rx="12" fill="#fef0dc" stroke="#b45309" stroke-width="2"/>
  <text x="78" y="544" text-anchor="middle" class="label">MuJoCo</text>
  <text x="78" y="566" text-anchor="middle" class="small">simulation clock</text>
  <rect x="142" y="518" width="116" height="62" rx="12" fill="#fef0dc" stroke="#b45309" stroke-width="2"/>
  <text x="200" y="544" text-anchor="middle" class="label">Replay</text>
  <text x="200" y="566" text-anchor="middle" class="small">recorded run</text>
  <rect x="264" y="518" width="116" height="62" rx="12" fill="#f7f1e8" stroke="#b8a792" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="322" y="544" text-anchor="middle" class="label" fill="#5c6773">Hardware</text>
  <text x="322" y="566" text-anchor="middle" class="small">planned for M7</text>
</svg>
