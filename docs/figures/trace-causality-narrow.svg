<svg xmlns="http://www.w3.org/2000/svg" width="400" height="570" viewBox="0 0 400 570" role="img" aria-labelledby="title desc">
  <title id="title">A trace preserves the causal chain from world state to observation</title>
  <desc id="desc">Robot and world identities lead to a snapshot, planning request, plan, validation, prepared command, execution, and observations. A trace links each record, while a run bundle adds the files needed to inspect it elsewhere.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#64748b"/>
    </marker>
    <style>
      .label { font: 600 15px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #17212b; }
      .body { font: 400 13px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #475569; }
      .eyebrow { font: 600 11.5px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; letter-spacing: 1px; fill: #64748b; }
    </style>
  </defs>
  <rect width="400" height="570" rx="18" fill="#fafaf7"/>

  <rect x="14" y="14" width="372" height="452" rx="16" fill="#f1f5f8" stroke="#cbd5df" stroke-width="2"/>
  <text x="32" y="40" class="eyebrow">TRACE</text>

  <g>
    <rect x="40" y="54" width="320" height="44" rx="10" fill="#e8f0f6" stroke="#2f5d7e"/>
    <text x="56" y="81" class="label">Robot + world</text>
    <text x="344" y="81" text-anchor="end" class="body">content identities</text>

    <rect x="40" y="112" width="320" height="44" rx="10" fill="#edf1f5" stroke="#64748b"/>
    <text x="56" y="139" class="label">Snapshot</text>
    <text x="344" y="139" text-anchor="end" class="body">state + revision</text>

    <rect x="40" y="170" width="320" height="44" rx="10" fill="#eeeaf8" stroke="#6d5aae"/>
    <text x="56" y="197" class="label">Request</text>
    <text x="344" y="197" text-anchor="end" class="body">goal + limits</text>

    <rect x="40" y="228" width="320" height="44" rx="10" fill="#eeeaf8" stroke="#6d5aae"/>
    <text x="56" y="255" class="label">Plan</text>
    <text x="344" y="255" text-anchor="end" class="body">path + timing</text>

    <rect x="40" y="286" width="320" height="44" rx="10" fill="#fff8ed" stroke="#b45309"/>
    <text x="56" y="313" class="label">Validation</text>
    <text x="344" y="313" text-anchor="end" class="body">policy + witness</text>

    <rect x="40" y="344" width="320" height="44" rx="10" fill="#fff8ed" stroke="#b45309"/>
    <text x="56" y="371" class="label">Command</text>
    <text x="344" y="371" text-anchor="end" class="body">runtime contract</text>

    <rect x="40" y="402" width="320" height="44" rx="10" fill="#e3f3f0" stroke="#0f766e"/>
    <text x="56" y="429" class="label">Execution</text>
    <text x="344" y="429" text-anchor="end" class="body">status + observations</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M200 98 L200 109"/><path d="M200 156 L200 167"/><path d="M200 214 L200 225"/>
    <path d="M200 272 L200 283"/><path d="M200 330 L200 341"/><path d="M200 388 L200 399"/>
  </g>

  <path d="M40 478 L40 496 L360 496 L360 478" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="60" y="484" width="280" height="70" rx="22" fill="#edf1f5" stroke="#64748b" stroke-width="1.5"/>
  <text x="200" y="508" text-anchor="middle" class="label">Run bundle</text>
  <text x="200" y="527" text-anchor="middle" class="body">verified trace + exact robot,</text>
  <text x="200" y="544" text-anchor="middle" class="body">scene, and array files</text>
</svg>
