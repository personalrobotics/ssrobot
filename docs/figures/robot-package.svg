<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 50 1100 510" role="img" aria-labelledby="title desc">
  <title id="title">A robot package combines an established model with explicit portable semantics</title>
  <desc id="desc">MJCF or URDF and SRDF provide the mechanical model. ssrobot.toml provides semantic roles, capabilities, channels, profiles, and limits. Both are validated together into one RobotDescription, while the package retains the original model files and assets for runtimes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker>
    <style>
      .label { font: 600 19px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #17212b; }
      .body { font: 400 15px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #475569; }
      .eyebrow { font: 600 13px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; letter-spacing: 1.1px; fill: #64748b; }
      .code { font: 600 17px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #17212b; }
    </style>
  </defs>
  <rect y="50" width="1100" height="510" rx="24" fill="#fafaf7"/>

  <rect x="42" y="92" width="660" height="450" rx="22" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="70" y="122" class="eyebrow">ROBOT PACKAGE · PORTABLE FILE CLOSURE</text>

  <rect x="76" y="156" width="258" height="112" rx="15" fill="#e8f0f6" stroke="#2f5d7e" stroke-width="2"/>
  <text x="205" y="190" text-anchor="middle" class="label">MJCF</text>
  <text x="205" y="215" text-anchor="middle" class="body">or URDF + SRDF</text>
  <text x="205" y="242" text-anchor="middle" class="body">topology · joints · model semantics</text>

  <rect x="76" y="302" width="258" height="146" rx="15" fill="#edf1f5" stroke="#64748b" stroke-width="2"/>
  <text x="205" y="338" text-anchor="middle" class="code">ssrobot.toml</text>
  <text x="205" y="366" text-anchor="middle" class="body">arms · bases · end effectors</text>
  <text x="205" y="390" text-anchor="middle" class="body">commands · channels · limits</text>
  <text x="205" y="414" text-anchor="middle" class="body">model choices · runtime profiles</text>

  <rect x="390" y="156" width="270" height="112" rx="15" fill="#f6f8fa" stroke="#94a3b8"/>
  <text x="525" y="190" text-anchor="middle" class="label">Original resources</text>
  <text x="525" y="217" text-anchor="middle" class="body">includes · meshes · textures</text>
  <text x="525" y="241" text-anchor="middle" class="body">calibration · backend models</text>

  <rect x="390" y="302" width="270" height="146" rx="15" fill="#f6f8fa" stroke="#94a3b8"/>
  <text x="525" y="338" text-anchor="middle" class="label">Validated file identity</text>
  <text x="525" y="366" text-anchor="middle" class="body">resolved paths · containment</text>
  <text x="525" y="390" text-anchor="middle" class="body">content hashes · provenance</text>
  <text x="525" y="414" text-anchor="middle" class="body">safe installed-package loading</text>

  <path d="M334 212 L358 212 L358 140 L718 140 C748 140 736 260 772 260" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M334 375 L358 375 L358 478 L718 478 C748 478 736 318 772 318" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M525 268 L525 294" fill="none" stroke="#94a3b8" stroke-width="1.7" marker-end="url(#arrow)"/>

  <rect x="780" y="212" width="276" height="160" rx="20" fill="#e3f3f0" stroke="#0f766e" stroke-width="3"/>
  <text x="918" y="252" text-anchor="middle" class="eyebrow" fill="#0f766e">PORTABLE MEANING</text>
  <text x="918" y="291" text-anchor="middle" class="code">RobotDescription</text>
  <text x="918" y="322" text-anchor="middle" class="body">immutable · validated</text>
  <text x="918" y="347" text-anchor="middle" class="body">simulator-independent</text>

  <text x="918" y="418" text-anchor="middle" class="body">Runtimes still read the original model.</text>
  <text x="918" y="442" text-anchor="middle" class="body">The description does not copy physics,</text>
  <text x="918" y="466" text-anchor="middle" class="body">geometry, or actuator parameters.</text>
</svg>
