<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 50 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Planning a continuation while the current motion executes</title>
  <desc id="desc">On the live context, motion A executes and reaches an observed arrival state. In parallel, a worker plans motion B from A's projected result. At arrival, the context checks the prediction and either validates a rebased continuation or replans from the measured state.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#334155"/></marker>
    <style>
      .label { font: 600 18px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #17212b; }
      .body { font: 400 14px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #475569; }
      .lane { font: 600 13px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; letter-spacing: 1.1px; fill: #64748b; }
    </style>
  </defs>
  <rect y="50" width="1200" height="440" rx="24" fill="#fafaf7"/>

  <text x="58" y="132" class="lane">LIVE CONTEXT</text>
  <line x1="182" y1="127" x2="1120" y2="127" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="210" y="92" width="310" height="70" rx="14" fill="#e3f3f0" stroke="#0f766e" stroke-width="2"/>
  <text x="365" y="121" text-anchor="middle" class="label">Execute motion A</text>
  <text x="365" y="145" text-anchor="middle" class="body">the runtime advances the live robot</text>
  <circle cx="565" cy="127" r="8" fill="#0f766e"/>
  <text x="565" y="96" text-anchor="middle" class="body">measured arrival</text>
  <rect x="610" y="92" width="190" height="70" rx="14" fill="#fff8ed" stroke="#b45309" stroke-width="2"/>
  <text x="705" y="121" text-anchor="middle" class="label">Check arrival</text>
  <text x="705" y="145" text-anchor="middle" class="body">scene · rest · tolerance</text>
  <rect x="850" y="92" width="235" height="70" rx="14" fill="#e3f3f0" stroke="#0f766e" stroke-width="2"/>
  <text x="967" y="121" text-anchor="middle" class="label">Execute motion B</text>
  <text x="967" y="145" text-anchor="middle" class="body">only after validation</text>
  <path d="M800 127 L842 127" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="58" y="260" class="lane">PLANNING WORKER</text>
  <line x1="182" y1="255" x2="1120" y2="255" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="220" width="230" height="70" rx="14" fill="#edf1f5" stroke="#64748b"/>
  <text x="365" y="249" text-anchor="middle" class="label">Project A's result</text>
  <text x="365" y="273" text-anchor="middle" class="body">not a captured snapshot</text>
  <rect x="515" y="220" width="245" height="70" rx="14" fill="#e8f0f6" stroke="#2f5d7e" stroke-width="2"/>
  <text x="638" y="249" text-anchor="middle" class="label">Plan motion B</text>
  <text x="638" y="273" text-anchor="middle" class="body">while A is still moving</text>
  <path d="M480 255 L507 255" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M760 255 C803 255 787 177 824 144" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="820" y="214" class="body">bind to A's execution</text>

  <path d="M250 220 C235 184 244 167 263 158" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>

  <rect x="250" y="355" width="780" height="112" rx="18" fill="#f6f8fa" stroke="#cbd5df"/>
  <line x1="640" y1="375" x2="640" y2="447" stroke="#cbd5df"/>
  <circle cx="286" cy="405" r="8" fill="#0f766e"/>
  <text x="310" y="397" class="label">Arrival agrees</text>
  <text x="310" y="422" class="body">rebase from the measured state,</text>
  <text x="310" y="445" class="body">validate the whole motion, then continue</text>
  <circle cx="676" cy="405" r="8" fill="#a13a3a"/>
  <text x="700" y="397" class="label">Arrival disagrees</text>
  <text x="700" y="422" class="body">refuse with evidence and replan</text>
  <text x="700" y="445" class="body">from the measured state</text>
</svg>
