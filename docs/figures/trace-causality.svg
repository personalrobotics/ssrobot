<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">A trace preserves the causal chain from world state to observation</title>
  <desc id="desc">Robot and world identities lead to a snapshot, planning request, plan, validation, prepared command, execution, and observations. A trace links each record, while a run bundle adds the files needed to inspect it elsewhere.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 600 30px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
      .label { font: 600 17px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
      .body { font: 400 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .eyebrow { font: 600 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.1px; fill: #64748b; }
    </style>
  </defs>
  <rect width="1200" height="430" rx="24" fill="#fafaf7"/>
  <text x="54" y="58" class="title">A causal record, not a stream of unrelated log messages</text>

  <rect x="45" y="104" width="1110" height="188" rx="20" fill="#f1f5f8" stroke="#cbd5df" stroke-width="2"/>
  <text x="72" y="132" class="eyebrow">TRACE</text>

  <g>
    <rect x="70" y="165" width="132" height="82" rx="12" fill="#e8f0f6" stroke="#2f5d7e"/>
    <text x="136" y="196" text-anchor="middle" class="label">Robot + world</text>
    <text x="136" y="220" text-anchor="middle" class="body">content identities</text>

    <rect x="226" y="165" width="120" height="82" rx="12" fill="#edf1f5" stroke="#64748b"/>
    <text x="286" y="196" text-anchor="middle" class="label">Snapshot</text>
    <text x="286" y="220" text-anchor="middle" class="body">state + revision</text>

    <rect x="370" y="165" width="120" height="82" rx="12" fill="#eeeaf8" stroke="#6d5aae"/>
    <text x="430" y="196" text-anchor="middle" class="label">Request</text>
    <text x="430" y="220" text-anchor="middle" class="body">goal + limits</text>

    <rect x="514" y="165" width="120" height="82" rx="12" fill="#eeeaf8" stroke="#6d5aae"/>
    <text x="574" y="196" text-anchor="middle" class="label">Plan</text>
    <text x="574" y="220" text-anchor="middle" class="body">path + timing</text>

    <rect x="658" y="165" width="120" height="82" rx="12" fill="#fff8ed" stroke="#b45309"/>
    <text x="718" y="196" text-anchor="middle" class="label">Validation</text>
    <text x="718" y="220" text-anchor="middle" class="body">policy + witness</text>

    <rect x="802" y="165" width="120" height="82" rx="12" fill="#fff8ed" stroke="#b45309"/>
    <text x="862" y="196" text-anchor="middle" class="label">Command</text>
    <text x="862" y="220" text-anchor="middle" class="body">runtime contract</text>

    <rect x="946" y="165" width="174" height="82" rx="12" fill="#e3f3f0" stroke="#0f766e"/>
    <text x="1033" y="196" text-anchor="middle" class="label">Execution</text>
    <text x="1033" y="220" text-anchor="middle" class="body">status + observations</text>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M202 206 L218 206"/><path d="M346 206 L362 206"/><path d="M490 206 L506 206"/>
    <path d="M634 206 L650 206"/><path d="M778 206 L794 206"/><path d="M922 206 L938 206"/>
  </g>

  <path d="M118 315 L118 344 L1080 344 L1080 315" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="341" y="320" width="518" height="54" rx="27" fill="#edf1f5" stroke="#64748b" stroke-width="1.5"/>
  <text x="600" y="343" text-anchor="middle" class="label">Run bundle</text>
  <text x="600" y="364" text-anchor="middle" class="body">verified trace + exact robot, scene, and array files</text>
</svg>
