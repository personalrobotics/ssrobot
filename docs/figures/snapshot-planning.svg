<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 55 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Planning leaves the live context and returns through one checked boundary</title>
  <desc id="desc">The live RobotContext captures one immutable snapshot. Three isolated planning scenes explore alternatives concurrently. Deterministic selection chooses one result, which must pass preparation and validation before it can execute. A refusal leads to another result or replanning. The trace links the whole sequence.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <style>
      .lane { font: 600 14px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; letter-spacing: 1.2px; }
      .label { font: 600 19px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #17212b; }
      .body { font: 400 15px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #475569; }
      .small { font: 500 14px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #5c6773; }
      .code { font: 600 17px Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif; fill: #17212b; }
    </style>
  </defs>

  <rect y="55" width="1200" height="690" rx="24" fill="#fafaf7"/>

  <rect x="50" y="92" width="1100" height="192" rx="18" fill="#edf8f5" stroke="#b9ddd6"/>
  <text x="78" y="124" class="lane" fill="#0f766e">LIVE SESSION · ONE AUTHORITY</text>

  <rect x="50" y="314" width="1100" height="330" rx="18" fill="#f1f5f8" stroke="#cbd5df"/>
  <text x="78" y="346" class="lane" fill="#2f5d7e">SPECULATIVE WORK · ISOLATED AND PARALLEL</text>

  <rect x="82" y="158" width="190" height="78" rx="14" fill="#e3f3f0" stroke="#0f766e" stroke-width="2.5"/>
  <text x="177" y="191" text-anchor="middle" class="code">RobotContext</text>
  <text x="177" y="216" text-anchor="middle" class="body">changing live state</text>

  <path d="M272 197 L343 197" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <circle cx="366" cy="197" r="11" fill="#0f766e"/>
  <text x="366" y="166" text-anchor="middle" class="small">capture</text>
  <path d="M366 208 C366 278 253 300 253 386" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

  <rect x="148" y="390" width="210" height="86" rx="14" fill="#edf1f5" stroke="#64748b" stroke-width="2"/>
  <text x="253" y="425" text-anchor="middle" class="code">SceneSnapshot</text>
  <text x="253" y="452" text-anchor="middle" class="body">immutable world state</text>

  <path d="M358 433 L414 433" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M414 433 L414 389 L438 389" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M414 433 L438 433" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M414 433 L414 477 L438 477" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="446" y="362" width="180" height="54" rx="12" fill="#e8f0f6" stroke="#2f5d7e"/>
  <text x="536" y="395" text-anchor="middle" class="label">Planning scene A</text>
  <rect x="446" y="426" width="180" height="54" rx="12" fill="#e8f0f6" stroke="#2f5d7e"/>
  <text x="536" y="459" text-anchor="middle" class="label">Planning scene B</text>
  <rect x="446" y="490" width="180" height="54" rx="12" fill="#e8f0f6" stroke="#2f5d7e"/>
  <text x="536" y="523" text-anchor="middle" class="label">Planning scene C</text>

  <path d="M626 389 C674 389 670 424 708 424" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M626 453 L708 453" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M626 517 C674 517 670 482 708 482" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="716" y="404" width="184" height="98" rx="14" fill="#eeeaf8" stroke="#6d5aae" stroke-width="2"/>
  <text x="808" y="440" text-anchor="middle" class="label">Deterministic</text>
  <text x="808" y="466" text-anchor="middle" class="label">selection</text>
  <text x="808" y="489" text-anchor="middle" class="small">priority · cost · order</text>

  <path d="M900 453 L944 453" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="952" y="390" width="162" height="126" rx="18" fill="#fff8ed" stroke="#b45309" stroke-width="3"/>
  <text x="1033" y="431" text-anchor="middle" class="code">prepare</text>
  <line x1="981" y1="447" x2="1085" y2="447" stroke="#d5b895"/>
  <text x="1033" y="476" text-anchor="middle" class="code">validate</text>
  <text x="1033" y="500" text-anchor="middle" class="small">execution contract</text>

  <path d="M1033 390 C1033 300 1014 263 1014 238" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="1052" y="315" class="small" fill="#0f766e">accepted</text>
  <rect x="921" y="158" width="188" height="78" rx="14" fill="#e3f3f0" stroke="#0f766e" stroke-width="2.5"/>
  <text x="1015" y="191" text-anchor="middle" class="label">Execute</text>
  <text x="1015" y="216" text-anchor="middle" class="body">through the context</text>

  <path d="M1033 516 L1033 564" fill="none" stroke="#a13a3a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="929" y="570" width="208" height="50" rx="12" fill="#fbeaea" stroke="#c87979"/>
  <text x="1033" y="601" text-anchor="middle" class="small">refused: another result or replan</text>

  <line x1="100" y1="700" x2="1100" y2="700" stroke="#64748b" stroke-width="2"/>
  <circle cx="366" cy="700" r="6" fill="#64748b"/>
  <circle cx="808" cy="700" r="6" fill="#64748b"/>
  <circle cx="1033" cy="700" r="6" fill="#64748b"/>
  <path d="M366 214 L366 694 M808 502 L808 694 M1033 236 L1033 694" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 7" fill="none"/>
  <rect x="82" y="663" width="574" height="30" fill="#fafaf7"/>
  <text x="100" y="684" class="lane" fill="#64748b">TRACE LINKS CAPTURE, CHOICE, CHECK, AND EXECUTION</text>
</svg>
