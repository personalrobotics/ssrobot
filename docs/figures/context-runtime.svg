<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A robot context binds one robot description to one runtime</title>
  <desc id="desc">A robot package produces a stable RobotDescription. RobotContext combines that description with exactly one runtime and presents one session to an application. Snapshots and traces leave the context as evidence. MuJoCo and replay are available runtimes, while hardware is planned.</desc>
  <defs>
    <marker id="arrow-ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 600 30px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
      .eyebrow { font: 600 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.3px; fill: #64748b; }
      .label { font: 600 20px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17212b; }
      .body { font: 400 16px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5c6773; }
      .code { font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #17212b; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="24" fill="#fafaf7"/>
  <text x="60" y="58" class="title">One robot session, one execution mechanism</text>

  <text x="462" y="100" class="eyebrow">STABLE ROBOT MEANING</text>
  <rect x="415" y="124" width="370" height="86" rx="14" fill="#e8f0f6" stroke="#2f5d7e" stroke-width="2"/>
  <text x="600" y="159" text-anchor="middle" class="code">Robot package</text>
  <text x="600" y="184" text-anchor="middle" class="body">models, semantics, capabilities, resources</text>

  <path d="M600 210 L600 250" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <rect x="430" y="252" width="340" height="82" rx="14" fill="#e8f0f6" stroke="#2f5d7e" stroke-width="2"/>
  <text x="600" y="286" text-anchor="middle" class="code">RobotDescription</text>
  <text x="600" y="311" text-anchor="middle" class="body">what the robot is</text>

  <path d="M600 334 L600 374" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <rect x="385" y="376" width="430" height="132" rx="20" fill="#e3f3f0" stroke="#0f766e" stroke-width="3"/>
  <text x="600" y="416" text-anchor="middle" class="eyebrow" fill="#0f766e">LIVE SESSION BOUNDARY</text>
  <text x="600" y="453" text-anchor="middle" class="code">RobotContext</text>
  <text x="600" y="482" text-anchor="middle" class="body">world · lifecycle · ownership · evidence</text>

  <rect x="52" y="386" width="260" height="112" rx="16" fill="#eeeaf8" stroke="#6d5aae" stroke-width="2"/>
  <text x="182" y="424" text-anchor="middle" class="eyebrow">DECISION SOURCE</text>
  <text x="182" y="456" text-anchor="middle" class="label">Application</text>
  <text x="182" y="482" text-anchor="middle" class="body">planner · policy · operator</text>
  <path d="M312 442 L376 442" fill="none" stroke="#6d5aae" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <path d="M376 465 L312 465" fill="none" stroke="#6d5aae" stroke-width="2" marker-end="url(#arrow-ink)"/>

  <rect x="888" y="366" width="250" height="74" rx="14" fill="#edf1f5" stroke="#64748b" stroke-width="2"/>
  <text x="1013" y="397" text-anchor="middle" class="label">Snapshots</text>
  <text x="1013" y="422" text-anchor="middle" class="body">immutable planning state</text>
  <rect x="888" y="458" width="250" height="74" rx="14" fill="#edf1f5" stroke="#64748b" stroke-width="2"/>
  <text x="1013" y="489" text-anchor="middle" class="label">Trace</text>
  <text x="1013" y="514" text-anchor="middle" class="body">causal execution record</text>
  <path d="M815 420 C848 420 854 403 880 403" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <path d="M815 472 C848 472 854 495 880 495" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-ink)"/>

  <path d="M600 638 L600 516" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arrow-ink)"/>
  <text x="600" y="560" text-anchor="middle" class="eyebrow" fill="#b45309">CHOOSE EXACTLY ONE RUNTIME</text>

  <rect x="254" y="626" width="220" height="82" rx="14" fill="#fef0dc" stroke="#b45309" stroke-width="2"/>
  <text x="364" y="660" text-anchor="middle" class="label">MuJoCo</text>
  <text x="364" y="686" text-anchor="middle" class="body">manual simulation clock</text>

  <rect x="490" y="626" width="220" height="82" rx="14" fill="#fef0dc" stroke="#b45309" stroke-width="2"/>
  <text x="600" y="660" text-anchor="middle" class="label">Replay</text>
  <text x="600" y="686" text-anchor="middle" class="body">recorded execution</text>

  <rect x="726" y="626" width="220" height="82" rx="14" fill="#f7f1e8" stroke="#b8a792" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="836" y="660" text-anchor="middle" class="label" fill="#5c6773">Hardware</text>
  <text x="836" y="686" text-anchor="middle" class="body">planned for M6</text>

  <path d="M364 626 C364 596 520 594 583 594" fill="none" stroke="#b45309" stroke-width="2"/>
  <path d="M600 626 L600 594" fill="none" stroke="#b45309" stroke-width="2"/>
  <path d="M836 626 C836 596 680 594 617 594" fill="none" stroke="#b8a792" stroke-width="2" stroke-dasharray="7 6"/>
</svg>
