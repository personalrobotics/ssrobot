[project]
name = "ssrobot"
version = "0.0.0"
description = "A small simulator-neutral robot interface for planning, policies, and real-world execution."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Siddhartha Srinivasa" }]
dependencies = []

[project.scripts]
ssrobot = "ssrobot.cli:main"

[project.optional-dependencies]
# Exact: sscbirrt's native MuJoCo adapter is built against this MuJoCo and refuses
# another, and MujocoRuntime checks it at open. Planning scenes are built on that adapter.
# sscbirrt is exact too: 3.13.0 keeps a planning clearance in each collision checker
# (sscbirrt#256), and checks no environment-against-environment pairs (sscbirrt#254).
mujoco = ["mujoco==3.14.0", "sscbirrt[mujoco]==3.13.0"]
# The sscbirrt, ssik, and sstsr adapter. 3.9 is the first sscbirrt release to expose
# the same public validator that planning applies; 3.13.0, as the mujoco extra pins. The adapter measures goal regions
# with sstsr directly; 3.5 is the first release whose distance wraps angles to the
# representative nearest the bound (sstsr#186).
planning = ["sscbirrt[ssik]==3.13.0", "sstsr>=3.5,<4"]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mujoco==3.14.0",
    "sscbirrt[mujoco,ssik]==3.13.0",
    "sstsr>=3.5,<4",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssrobot"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]  # illustrative snippets in docs keep their own layout

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "mujoco", "mujoco.*", "sscbirrt", "sscbirrt.*", "ssik", "ssik.*", "tsr", "tsr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
