# A small arm and gripper that runs in MujocoRuntime: see arm.xml. The semantics are declared
# here, because MJCF has none. link1/link3 is declared here, not excluded in the MJCF.
schema = "ssrobot.package"
version = 1
robot = "mujoco_arm"
canonical_model = "mjcf"

[[models]]
name = "mjcf"
format = "mjcf"
path = "arm.xml"

[[profiles]]
name = "sim"
runtime = "mujoco"
path = "mujoco.toml"

[[semantics.groups]]
name = "arm"
joints = ["shoulder", "elbow", "wrist"]

[[semantics.grippers]]
name = "gripper"
frame = "gripper"
joints = ["left_finger_joint", "right_finger_joint"]

[[semantics.end_effectors]]
name = "hand"
frame = "tcp"
gripper = "gripper"

[[semantics.manipulators]]
name = "arm"
group = "arm"
base_frame = "base"
tool_frame = "flange"
end_effector = "hand"

[[semantics.sensors]]
name = "wrist_camera"
kind = "camera"
frame = "wrist_camera"

[[semantics.collision_allowances]]
frame_a = "link1"
frame_b = "link3"
reason = "declared by the package"

# A runtime must confirm each of these. MujocoRuntime confirms all but the velocity
# command: arm.xml has no velocity actuators.
[[semantics.commands]]
component = "arm"
kind = "joint"
mode = "position"

[[semantics.commands]]
component = "arm"
kind = "joint_trajectory"

[[semantics.commands]]
component = "gripper"
kind = "gripper"

[[semantics.commands]]
component = "arm"
kind = "joint"
mode = "velocity"

[[semantics.channels]]
name = "arm_q"
quantity = "joint_position"
source = "arm"
shape = [3]
dtype = "float64"

[[semantics.channels]]
name = "arm_qd"
quantity = "joint_velocity"
source = "arm"
shape = [3]
dtype = "float64"

[[semantics.channels]]
name = "gripper_opening"
quantity = "gripper_opening"
source = "gripper"
shape = [1]
dtype = "float64"
