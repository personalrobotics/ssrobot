# A small arm and gripper that runs in MujocoRuntime: see arm.xml. The semantics are declared
# here, because MJCF has none. link1/link3 is declared here, not excluded in the MJCF.
schema = "ssrobot.package"
version = 1
robot = "mujoco_arm"
canonical_model = "mjcf"

[[models]]
name = "mjcf"
format = "mjcf"
path = "arm.xml"

[[profiles]]
name = "sim"
runtime = "mujoco"
path = "mujoco.toml"

[[semantics.groups]]
name = "arm"
joints = ["shoulder", "elbow", "wrist"]

# The wrist alone, overlapping the arm: a chunk may not command both at once.
[[semantics.groups]]
name = "wrist_only"
joints = ["wrist"]

# The arm's home pose. arm.xml's keyframe of the same name must agree, and mujoco.toml
# starts MujocoRuntime there.
[[semantics.configurations]]
name = "home"
group = "arm"
positions = [0.5, -1.0, 0.25]

# MJCF cannot express velocity or acceleration limits, so the package declares them: the
# arm's joints at 180 deg/s and 5 rad/s^2, like a UR5e's, and the fingers at 0.1 m/s. A declaration may add or tighten a
# model limit, never widen one.
[[semantics.joint_limits]]
joint = "shoulder"
velocity = 3.141592653589793
acceleration = 5.0

[[semantics.joint_limits]]
joint = "elbow"
velocity = 3.141592653589793
acceleration = 5.0

[[semantics.joint_limits]]
joint = "wrist"
velocity = 3.141592653589793
acceleration = 5.0

[[semantics.joint_limits]]
joint = "left_finger_joint"
velocity = 0.1

[[semantics.joint_limits]]
joint = "right_finger_joint"
velocity = 0.1

[[semantics.grippers]]
name = "gripper"
frame = "gripper"
joints = ["left_finger_joint", "right_finger_joint"]

[[semantics.end_effectors]]
name = "hand"
frame = "tcp"
gripper = "gripper"

[[semantics.manipulators]]
name = "arm"
group = "arm"
base_frame = "base"
tool_frame = "flange"
end_effector = "hand"

[[semantics.sensors]]
name = "wrist_camera"
kind = "camera"
frame = "wrist_camera"

[[semantics.sensors]]
name = "wrist_ft"
kind = "force_torque"
frame = "ft_site"

[[semantics.collision_allowances]]
frame_a = "link1"
frame_b = "link3"
reason = "declared by the package"

# A runtime must confirm each of these. MujocoRuntime confirms all but the velocity
# command: arm.xml has no velocity actuators.
[[semantics.commands]]
component = "arm"
kind = "joint"
mode = "position"

[[semantics.commands]]
component = "arm"
kind = "joint_trajectory"

[[semantics.commands]]
component = "gripper"
kind = "gripper"

[[semantics.commands]]
component = "arm"
kind = "joint"
mode = "velocity"

[[semantics.commands]]
component = "wrist_only"
kind = "joint"
mode = "position"

[[semantics.channels]]
name = "arm_q"
quantity = "joint_position"
source = "arm"
shape = [3]
dtype = "float64"

[[semantics.channels]]
name = "arm_qd"
quantity = "joint_velocity"
source = "arm"
shape = [3]
dtype = "float64"

[[semantics.channels]]
name = "gripper_opening"
quantity = "gripper_opening"
source = "gripper"
shape = [1]
dtype = "float64"

[[semantics.channels]]
name = "arm_qf"
quantity = "joint_effort"
source = "arm"
shape = [3]
dtype = "float64"

[[semantics.channels]]
name = "tcp_pose"
quantity = "pose"
source = "tcp"
frame = "base"
shape = [7]
dtype = "float64"

[[semantics.channels]]
name = "camera_pose"
quantity = "pose"
source = "wrist_camera"
frame = "world"
shape = [7]
dtype = "float64"

[[semantics.channels]]
name = "wrist_wrench"
quantity = "wrench"
source = "wrist_ft"
shape = [6]
dtype = "float64"

[[semantics.channels]]
name = "wrist_rgb"
quantity = "rgb_image"
source = "wrist_camera"
shape = [48, 64, 3]
dtype = "uint8"

[[semantics.channels]]
name = "wrist_depth"
quantity = "depth_image"
source = "wrist_camera"
shape = [48, 64]
dtype = "float32"
