# MujocoRuntime settings for arm.xml: the keyframe it starts in, which control values
# close and open the gripper, and when the readings this simulation produces count as at
# rest.
schema = "ssrobot.MujocoProfile"
version = 1
keyframe = "home"

# When a scene object's privileged pose counts as at rest: within 1 mm per coordinate
# and 0.05 rad of turn for 100 ms, one sample per 2 ms control tick, a dropped tick
# breaking continuity. The example arm and its objects are illustrative and have no
# physical counterpart, so these are declared values, not a calibration.
object_rest = { cadence_ns = 2_000_000, max_gap_ns = 2_000_000, dwell_ns = 100_000_000, translation_m = 0.001, rotation_rad = 0.05, source = "example arm, illustrative: declared values, 1 mm and 0.05 rad held for 100 ms; one sample per 2 ms control tick" }

# When the arm's joint positions count as at rest, as this simulation produces them: one
# sample per control tick (arm.xml's 2 ms timestep, one substep), and a dropped tick
# breaks continuity. The example arm is illustrative and has no physical counterpart, so
# its values are declared ones, standing in for the calibration a robot's simulated
# signal gets: 2*pi/2^17 rad per joint, the step of a 17-bit encoder, held for 70 ms.
[[rest]]
channel = "arm_q"
criteria = { cadence_ns = 2_000_000, max_gap_ns = 2_000_000, dwell_ns = 70_000_000, variation = [4.7936899621426287e-05, 4.7936899621426287e-05, 4.7936899621426287e-05], source = "example arm, illustrative: declared values, 2*pi/2^17 rad per joint, a 17-bit encoder step, held for 70 ms; one sample per 2 ms control tick" }

[[grippers]]
gripper = "gripper"
actuators = [
  { actuator = "left_finger", closed = 0.0, open = 0.04 },
  { actuator = "right_finger", closed = 0.0, open = 0.04 },
]
# When a gripper command's motion has ended, from the measured opening. The fingers come
# to rest 0.01 of their travel inside their joint limits, where MuJoCo's soft limit
# balances the servo, so the goal tolerance is 0.02. A still opening varies by at most
# 1/255, the resolution of a Robotiq-style position register, for 100 ms, the dwell
# measured on Geodude's 2F-140: on this hand no dwell from 20 ms up stalls a free motion.
completion = { goal_tolerance = 0.02, stall_delta = 0.00392156862745098, stall_dwell_ns = 100_000_000 }
