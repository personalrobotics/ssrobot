# MujocoRuntime settings for arm.xml: the keyframe it starts in, which control values
# close and open the gripper, and when the readings this simulation produces count as at
# rest.
schema = "ssrobot.MujocoProfile"
version = 1
keyframe = "home"

# When a scene object's privileged pose counts as at rest. The pose carries no sensor
# noise, so the bounds come from the contact model: 1 mm, the width of MuJoCo's default
# contact impedance (solimp), over which a resting contact may still sink, and the turn
# that width makes rolling the smallest example object, a 2 cm-radius ball:
# 0.001 / 0.02 = 0.05 rad. They must hold for 100 ms, five time constants of MuJoCo's
# default critically damped contact (solref 0.02 s), over which a contact transient decays
# by e^-5. One sample per 2 ms control tick; a dropped tick breaks continuity.
object_rest = { cadence_ns = 2_000_000, max_gap_ns = 2_000_000, dwell_ns = 100_000_000, translation_m = 0.001, rotation_rad = 0.05, source = "MuJoCo default contact model: solimp width 0.001 m, and its rolling turn on a 0.02 m-radius ball, 0.05 rad; dwell of five solref time constants, 5 x 0.02 s; one sample per 2 ms control tick" }

# When the arm's joint positions count as at rest, as this simulation produces them: one
# sample per control tick (arm.xml's 2 ms timestep, one substep), and a dropped tick
# breaks continuity. A still joint varies by at most 2*pi/2^17 rad, the resolution of the
# 17-bit single-turn absolute encoder the example arm is modelled with, for 70 ms, the
# time constant of its position servos, (kv + damping) / kp = (20 + 1) / 300 s in arm.xml.
[[rest]]
channel = "arm_q"
criteria = { cadence_ns = 2_000_000, max_gap_ns = 2_000_000, dwell_ns = 70_000_000, variation = 4.7936899621426287e-05, source = "example arm: 17-bit absolute encoder resolution, 2*pi/2^17 rad; dwell of one position-servo time constant, (kv + damping) / kp = 21/300 s, from arm.xml; one sample per 2 ms control tick" }

[[grippers]]
gripper = "gripper"
actuators = [
  { actuator = "left_finger", closed = 0.0, open = 0.04 },
  { actuator = "right_finger", closed = 0.0, open = 0.04 },
]
# When a gripper command's motion has ended, from the measured opening. The fingers come
# to rest 0.01 of their travel inside their joint limits, where MuJoCo's soft limit
# balances the servo, so the goal tolerance is 0.02. A still opening varies by at most
# 1/255, the resolution of a Robotiq-style position register, for 100 ms, the dwell
# measured on Geodude's 2F-140: on this hand no dwell from 20 ms up stalls a free motion.
completion = { goal_tolerance = 0.02, stall_delta = 0.00392156862745098, stall_dwell_ns = 100_000_000 }
