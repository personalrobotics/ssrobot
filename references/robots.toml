# The two full reference robots (#12). Each pin is a reviewed commit of the robot's
# asset repository whose package carries an ssrobot.toml. The packages own their
# manifests; ssrobot only pins and validates them. scripts/check_reference_robots.py
# reads this file.

[[robots]]
name = "geodude"
repository = "personalrobotics/geodude_assets"
commit = "e7be8b437cd954285a9fb515a6de39fb94b3fc42"
module = "geodude_assets"
package_root = "src/geodude_assets"
# No keyframe: the package's MuJoCo profile starts it at "ready" (#95).

# Structural facts the report must show. They are checked through the public report,
# never by robot-specific code.
[robots.expect]
# The reviewed semantic identity. Any change to the description, intended or not,
# must update this fingerprint in review.
fingerprint = "f49caa42cf97010d963f5ce82e0ad999fb6f9e139456ef5cd89d9033125b1987"
model_format = "mjcf"
license = "MIT"
manipulators = 4
grippers = 2
end_effectors = 2
prismatic_joints = 2
revolute_or_continuous_joints = 28
# What MujocoRuntime confirms from the package's declarations, and drives (#95).
confirmed_commands = 10
confirmed_channels = 12

# The two-robot planning proof (#22, #24): what the one scenario function in
# scripts/check_reference_robots.py plans for this robot. All of it is data.
[robots.scenario]
manipulator = "right_arm"
scene = "references/scenes/geodude-cylinder.xml"
object = "cylinder"
# Restricted to the manipulator's joints: "ready" covers both arms and lifts.
configuration = "ready"
# A side-grasp band: the hand's TCP (z approach, fingers opening along y) 10 cm from the
# cylinder's axis, pointing at it, level, at any angle around it.
frame = "right_ur5e/gripper/grasp_site"
offset_position = [-0.10, 0.0, 0.0]
offset_quat_wxyz = [0.7071067811865476, 0.0, 0.7071067811865476, 0.0]
position_bounds = [[0.0, 0.0], [0.0, 0.0], [-0.02, 0.02]]
rotation_bounds = [[0.0, 0.0], [0.0, 0.0], [-3.141592653589793, 3.141592653589793]]

# The guarded-contact proof (#124): the open hand in the side-grasp band above, then a
# straight 20 cm move of its TCP along its approach axis (z) into the cylinder, guarded
# by the wrist's force-torque sensor. The move is built by IK and meant to make contact.
[robots.scenario.guard]
frame = "right_ur5e/gripper/grasp_site"
channel = "right_wrist_wrench"
part = "force"
# Pushing the free cylinder across the worktable peaks near 9 N; the free run stays
# near 0.1 N.
threshold = 5.0
offset_position = [-0.10, 0.0, 0.0]
offset_quat_wxyz = [0.7071067811865476, 0.0, 0.7071067811865476, 0.0]
position_bounds = [[0.0, 0.0], [0.0, 0.0], [-0.005, 0.005]]
rotation_bounds = [[0.0, 0.0], [0.0, 0.0], [-3.141592653589793, 3.141592653589793]]
direction_in_frame = [0.0, 0.0, 1.0]
distance = 0.20
duration_ns = 4_000_000_000

# The gripper-contact proof (#219): a fixed cylinder, 4 cm across and 12 cm long, between
# the open fingers at the start, 2.5 cm ahead of the TCP along its approach axis (z), clear
# of the palm. Its axis is the TCP's x, across the fingers, which close along y. Closing
# on it must stop short.
[robots.scenario.grip]
frame = "right_ur5e/gripper/grasp_site"
radius = 0.02
half_length = 0.06
position_in_frame = [0.0, 0.0, 0.025]
quat_in_frame_wxyz = [0.7071067811865476, 0.0, 0.7071067811865476, 0.0]

[[robots]]
name = "ada"
repository = "personalrobotics/ada_assets"
commit = "8ddf90643bd1793f7de130ea10963fcf0b6ca8df"
module = "ada_assets"
package_root = "src/ada_assets"
# No keyframe: the package's MuJoCo profile starts it at "resting" (#95,
# personalrobotics/ada_assets#17).

[robots.expect]
fingerprint = "d0346b1373ef3bfe3e294bdf9dc09b4517b5618df0471f42e777a04aedb71c1d"
model_format = "mjcf"
license = "MIT"
manipulators = 1
grippers = 1
end_effectors = 1
prismatic_joints = 0
# The JACO2's six joints and four finger joints, and the articutool's tilt and roll.
revolute_or_continuous_joints = 12
# Arm and articutool joint position and trajectory, and the gripper; ten channels,
# including the wrist camera's RGB and depth, which need rendering (OSMesa in CI).
confirmed_commands = 5
confirmed_channels = 10

[robots.scenario]
manipulator = "arm"
scene = "references/scenes/ada-cylinder.xml"
object = "cylinder"
configuration = "above_plate"
# ADA's package mounts the articutool in the hand, so its region constrains the fork
# tip, not the hand: the tine pointing down, tilted up to 40° from vertical as in a
# feeding approach, 5 cm above the cylinder's top, at any angle around it. Over the
# table, a vertical fork is out of the arm's reach (no placement of 30 sampled plans).
frame = "articutool/fork_tip"
# Tilt turns the fork about its tip, 5 cm above the cylinder's top.
origin_position = [0.0, 0.0, 0.11]
offset_position = [0.0, 0.0, 0.0]
offset_quat_wxyz = [0.0, 1.0, 0.0, 0.0]
position_bounds = [[-0.01, 0.01], [-0.01, 0.01], [-0.02, 0.02]]
rotation_bounds = [[-0.6981317007977318, 0.6981317007977318], [-0.6981317007977318, 0.6981317007977318], [-3.141592653589793, 3.141592653589793]]

# Where the cylinder stands: a sample of the stable-placement TSR of an upright cylinder
# on the hospital table's top (scenes/ada-cylinder.xml), the first from this seed at
# which the region above plans. scripts/place_reference_object.py chooses it;
# check_reference_robots.py checks the scene's cylinder lies in the TSR.
[robots.scenario.placement]
surface_position = [0.06, -0.48, 0.735]
half_extents = [0.926, 0.371]
radius = 0.02
height = 0.12
seed = 0

# The guarded-contact proof (#124): the fork tip above the cylinder's top, tilted as in
# the region above, then a straight 10 cm descent, straight down onto it, guarded by
# the tool's force-torque sensor. The descent is built by IK and is meant to make contact.
[robots.scenario.guard]
frame = "articutool/fork_tip"
channel = "tool_wrench"
part = "force"
threshold = 10.0
# Tilt turns the fork about its tip, 5 cm above the cylinder's top.
origin_position = [0.0, 0.0, 0.11]
offset_position = [0.0, 0.0, 0.0]
offset_quat_wxyz = [0.0, 1.0, 0.0, 0.0]
position_bounds = [[-0.005, 0.005], [-0.005, 0.005], [-0.005, 0.005]]
rotation_bounds = [[-0.6981317007977318, 0.6981317007977318], [-0.6981317007977318, 0.6981317007977318], [-3.141592653589793, 3.141592653589793]]
direction_in_world = [0.0, 0.0, -1.0]
distance = 0.10
duration_ns = 3_000_000_000

# No gripper-contact proof (#219) for this package: it mounts the articutool in the hand,
# its handle where the fingers close, with the fingers' contacts with it excluded. The
# bare-hand package below, ada_hand, closes on a cylinder instead. Its empty close and
# unobstructed open are still driven, and each must end reached_target.

# ADA with an empty hand (#236, personalrobotics/ada_assets#43): the same arm and gripper
# without the articutool, its end effector the palm grasp site, sstsr's canonical
# parallel-jaw frame (z along the approach, y along the fingers' opening). The package is
# the models/ directory of the same repository.
[[robots]]
name = "ada_hand"
repository = "personalrobotics/ada_assets"
commit = "8ddf90643bd1793f7de130ea10963fcf0b6ca8df"
module = "ada_assets.models"
package_root = "src/ada_assets/models"
# No keyframe: the package's MuJoCo profile starts it at "resting", fingers open.

[robots.expect]
fingerprint = "25ed82d83091521bcff1021df2a0a7debac7ac82b3febad2c054677ef8ad643e"
model_format = "mjcf"
license = "MIT"
manipulators = 1
grippers = 1
end_effectors = 1
prismatic_joints = 0
# The JACO2's six joints and four finger joints.
revolute_or_continuous_joints = 10
# Arm joint position and trajectory, and the gripper; arm position, velocity, and
# effort, and the gripper's opening.
confirmed_commands = 3
confirmed_channels = 4

[robots.scenario]
manipulator = "arm"
scene = "references/scenes/ada-cylinder.xml"
object = "cylinder"
configuration = "above_plate"
# A side-grasp band, as Geodude's: the palm grasp site 10 cm from the cylinder's axis,
# pointing at it, level, at any angle around it. The hand is turned half a turn about its
# approach axis from Geodude's, as sstsr 4.2.0's KinovaJaco2TwoFinger side grasp turns
# it: turned as Geodude's, every sampled goal near the table is in collision or out of
# reach.
frame = "palm_grasp_site"
offset_position = [-0.10, 0.0, 0.0]
offset_quat_wxyz = [0.0, 0.7071067811865476, 0.0, 0.7071067811865476]
position_bounds = [[0.0, 0.0], [0.0, 0.0], [-0.02, 0.02]]
rotation_bounds = [[0.0, 0.0], [0.0, 0.0], [-3.141592653589793, 3.141592653589793]]

# The guarded-contact proof (#236): the open hand palm down over the table, beside the
# cylinder, then a straight 10 cm descent onto the table, guarded by the arm's joint
# actuator effort. The open fingertips reach 3.7 cm past the palm grasp site, which
# starts 2.7 cm above the cylinder's centre (8.7 cm above the table's top), so they
# start 5 cm above the table, and the descent is meant to make contact. Its region
# keeps the open hand, 10.6 cm across its fingers, 25 cm from the cylinder's axis.
[robots.scenario.guard]
frame = "palm_grasp_site"
channel = "arm_qf"
# Joint actuator effort, not contact torque: the thresholds are derived, not declared.
# The same descent first runs where nothing is touched, and every joint's threshold is
# this margin times the largest tared change of any joint's effort over it.
margin = 2.0
origin_position = [-0.20, 0.15, 0.027]
offset_position = [0.0, 0.0, 0.0]
offset_quat_wxyz = [0.0, 1.0, 0.0, 0.0]
position_bounds = [[-0.005, 0.005], [-0.005, 0.005], [-0.005, 0.005]]
rotation_bounds = [[0.0, 0.0], [0.0, 0.0], [-3.141592653589793, 3.141592653589793]]
direction_in_world = [0.0, 0.0, -1.0]
distance = 0.10
duration_ns = 3_000_000_000

# The gripper-contact proof (#219): a fixed cylinder of the size ada_assets' own grasp
# test uses, 5 cm across and 10 cm long, between the open fingers at the start, where
# sstsr 4.2.0's KinovaJaco2TwoFinger mid side grasp puts its centre, 6.41 cm ahead of the
# palm grasp site along its approach axis (z). Its axis is the site's x, across the
# fingers, which close along y. Closing on it must stop short. (On the scene's 4 cm
# cylinder the closed fingers' opening varies by about 3e-4 for as long as they press,
# more than the stall bound in the package's completion detector, so the close never
# ends.)
[robots.scenario.grip]
frame = "palm_grasp_site"
radius = 0.025
half_length = 0.05
position_in_frame = [0.0, 0.0, 0.0641]
quat_in_frame_wxyz = [0.7071067811865476, 0.0, 0.7071067811865476, 0.0]

# When arm_q counts as at rest in MuJoCo: every joint within its variation for 370 ms,
# read every 2 ms control tick with none dropped. The package's profile declares no rest
# criteria (ADA's were measured with the articutool, a different load), so they are
# declared here until the package declares its own; the checks refuse both. The
# variation is declared, the bound on what counts as still: ADA's, each joint within 2
# steps of 2*pi/2^17 rad, for the same JACO2 joints. The dwell is measured against it
# on the readings exactly as observed: one tick longer than the longest interval they
# stayed within it and then moved (368 ms), over reaches, out-and-backs, pauses, and
# single-joint moves from the keyframe and the four named configurations, judged from
# each trajectory's end, 28 of 28 judged trials passing. The arm cannot raise the
# cylinder by its first joint, so no payload trial is judged. MuJoCo source's values;
# the hardware is unmeasured. Evidence: references/evidence/ada_hand-mujoco-rest.json,
# written by scripts/calibrate_rest.py --robot ada_hand at ssrobot 8711dd8bf5bd.
[[robots.scenario.rest]]
channel = "arm_q"
max_gap_ns = 2_000_000
dwell_ns = 370_000_000
variation = [9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05]
source = "MuJoCo source's values: variation declared per joint ([9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05, 9.587379924285257e-05]), the bound on what counts as still; dwell one tick longer than the longest interval that looked still and then moved, 368000000 ns, judged from each trajectory's end; measured by ssrobot scripts/calibrate_rest.py at ssrobot 8711dd8bf5bd on personalrobotics/ada_assets@8ddf90643bd1; the hardware is unmeasured; references/evidence/ada_hand-mujoco-rest.json sha256 65a9494032daa5454a442b1baef20db7c4b1b3e947a6e17119223e418933d1dc"
