name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # MuJoCo renders camera channels headless through OSMesa.
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # generate_stack.py --check compares uv's resolutions byte for byte.
          version: "0.12.15"
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/generate_schemas.py --check
      - run: uv run python scripts/generate_refusals.py --check
      - run: uv run python scripts/generate_stack.py --check
      - run: uv run python scripts/check_doc_links.py
      - run: uv run pytest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: m0-evidence-py${{ matrix.python }}
          path: artifacts/
          if-no-files-found: error

  installed:
    # Verifies the built wheel in an environment that has nothing else installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv build --out-dir dist
      - run: uv venv --no-project clean
      - run: uv pip install --python clean dist/*.whl
      - run: uv pip list --python clean
      - name: The installed wheel provides the ssrobot command
        run: clean/bin/ssrobot --help
      - name: Dependency gate on the installed wheel
        run: clean/bin/python scripts/check_core_imports.py --installed --report artifacts/installed-conformance/imports.json
      - name: The mujoco extra in its own clean environment
        run: |
          uv venv --no-project clean-mujoco
          uv pip install --python clean-mujoco "$(echo dist/*.whl)[mujoco]"
      - name: Dependency gate on the installed wheel with the mujoco extra
        run: clean-mujoco/bin/python scripts/check_core_imports.py --installed --integration mujoco --report artifacts/installed-conformance/imports-mujoco.json
      - name: The mujoco and planning extras together in their own clean environment
        run: |
          uv venv --no-project clean-planning
          uv pip install --python clean-planning "$(echo dist/*.whl)[mujoco,planning]"
      - name: Dependency gate on the installed wheel with the planning extra
        run: clean-planning/bin/python scripts/check_core_imports.py --installed --integration planning --report artifacts/installed-conformance/imports-planning.json
      - name: Dependency gate on the installed wheel's demo, which composes both extras
        run: clean-planning/bin/python scripts/check_core_imports.py --installed --integration demo --report artifacts/installed-conformance/imports-demo.json
      - name: The demo runs from the installed wheel alone, the same twice, and reads back after a move
        working-directory: ${{ runner.temp }}
        run: |
          python="$GITHUB_WORKSPACE/clean-planning/bin/python"
          "$python" -P -m ssrobot.demo --out demo-a --seed 0 | tee demo-a.txt
          "$python" -P -m ssrobot.demo --out demo-b --seed 0 > /dev/null
          diff demo-a/report.json demo-b/report.json
          mv demo-a demo-moved
          "$python" -P -c "import ssrobot; b = ssrobot.open_bundle('demo-moved/bundle'); t = ssrobot.read_trace('demo-moved/trace.jsonl'); assert len(b.records) == len(t) > 0; print(len(t), 'records read back')"
          # The printed verification command runs as printed, whatever the output path.
          "$python" -P -m ssrobot.demo --out "odd dir/it's \"x\" \$HOME" > odd.txt
          bash -c "$(sed -n 's/^verify and read it: //p' odd.txt)"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/installed-conformance/demo"
          cp -R demo-moved/. demo-a.txt "$GITHUB_WORKSPACE/artifacts/installed-conformance/demo/"
      - name: Without the extras, the demo refuses and names them
        working-directory: ${{ runner.temp }}
        run: |
          status=0
          "$GITHUB_WORKSPACE/clean/bin/python" -P -m ssrobot.demo --out demo-core 2> demo-core.txt || status=$?
          cat demo-core.txt
          test "$status" = 2 && grep -q 'ssrobot\[mujoco,planning\]' demo-core.txt && test ! -e demo-core
      - name: The README's planning example runs from the installed wheel, and its trace is kept
        working-directory: ${{ github.workspace }}
        run: |
          # The section's Python block is the complete, runnable example, run from the root.
          sed -n '/^## Planning and execution in MuJoCo/,/^## /p' README.md | sed -n '/^```python$/,/^```$/{p;/^```$/q;}' | sed '1d;$d' > "$RUNNER_TEMP/readme_example.py"
          clean-planning/bin/python -P "$RUNNER_TEMP/readme_example.py" | tee "$RUNNER_TEMP/readme_example.txt"
          grep -q '^succeeded native ' "$RUNNER_TEMP/readme_example.txt"
          mkdir -p artifacts/installed-conformance/readme-example
          cp -R run/. "$RUNNER_TEMP/readme_example.txt" artifacts/installed-conformance/readme-example/
      - name: The reference application runs from the installed wheel as documented, the same twice and with the released viewer
        working-directory: ${{ runner.temp }}
        run: |
          app="$GITHUB_WORKSPACE/examples/pick/pick.py"
          planning() { "$GITHUB_WORKSPACE/clean-planning/bin/python" -P "$@"; }
          planning "$app" --out pick-a | tee pick-a.txt
          planning "$app" --out pick-b > /dev/null
          diff pick-a/report.json pick-b/report.json
          uv venv --no-project "$GITHUB_WORKSPACE/clean-view"
          uv pip install --python "$GITHUB_WORKSPACE/clean-view" "$(echo $GITHUB_WORKSPACE/dist/*.whl)[mujoco,planning]" ssmjviser==1.0.1
          "$GITHUB_WORKSPACE/clean-view/bin/python" -P "$app" --out pick-view --view < /dev/null | tee pick-view.txt
          # The view only reads the simulation: the trace is byte-identical without it.
          cmp pick-a/trace.jsonl pick-view/trace.jsonl
          # No learning, hardware, or middleware module, nor a viewer without --view.
          planning -c "import json, runpy, sys; g = runpy.run_path(sys.argv[1]); m = set(json.load(open('pick-a/report.json'))['modules']); bad = (m & g['PROHIBITED']) - g['INTEGRATIONS']['mujoco'] - g['INTEGRATIONS']['planning']; print(sorted(m)); assert not bad, bad" "$GITHUB_WORKSPACE/scripts/check_core_imports.py"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/installed-conformance/pick"
          cp -R pick-a pick-view pick-a.txt pick-view.txt "$GITHUB_WORKSPACE/artifacts/installed-conformance/pick/"
      - name: A planning scene builds on sscbirrt's native scene from the installed wheel
        working-directory: ${{ runner.temp }}
        run: >-
          $GITHUB_WORKSPACE/clean-mujoco/bin/python -P -c "import ssrobot;
          from ssrobot.mujoco import MujocoRuntime;
          p = ssrobot.load_package('$GITHUB_WORKSPACE/examples/packages/mujoco_arm');
          r = MujocoRuntime(p, scene='$GITHUB_WORKSPACE/examples/scenes/pedestal.xml');
          ctx = ssrobot.RobotContext(p.description, r); ctx.__enter__();
          s = ctx.planning_scene(ctx.snapshot(), 'arm');
          print(type(s.native()).__name__, s.is_valid((0.0, -0.4, 0.0)), s.is_valid((0.0, 1.2, 0.0)));
          assert s.is_valid((0.0, -0.4, 0.0)) and not s.is_valid((0.0, 1.2, 0.0));
          ctx.close()"
      - name: Without a display or MUJOCO_GL, camera channels are unconfirmed, not fatal
        working-directory: ${{ github.workspace }}
        run: >-
          clean-mujoco/bin/python -P -c "import ssrobot;
          from ssrobot.mujoco import MujocoRuntime;
          p = ssrobot.load_package('examples/packages/mujoco_arm');
          r = MujocoRuntime(p);
          ctx = ssrobot.RobotContext(p.description, r); ctx.__enter__();
          why = {b.name: b.unavailable.code for b in r.mapping.channels if b.unavailable};
          ctx.close(); print(why);
          assert why == {'wrist_rgb': 'rendering_unavailable', 'wrist_depth': 'rendering_unavailable'}, why"
      - name: Both reference packages are authored from their models with the installed commands
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/clean/bin/python -P $GITHUB_WORKSPACE/scripts/author_reference_packages.py --out $GITHUB_WORKSPACE/artifacts/installed-conformance/authoring --ssrobot $GITHUB_WORKSPACE/clean/bin/ssrobot
      - name: Conformance from the installed wheel
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/clean/bin/python -m ssrobot.conformance --out $GITHUB_WORKSPACE/artifacts/installed-conformance
      - name: The committed conformance artifacts verify from the installed wheel, MuJoCo included
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/clean-mujoco/bin/python -m ssrobot.mujoco.conformance --check $GITHUB_WORKSPACE/conformance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-conformance
          path: artifacts/installed-conformance/
          if-no-files-found: error

  stack:
    # Each supported stack (docs/stack.md), installed exactly from its lock with the
    # built wheel, verified, and reported.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: minimum
            python: "3.11"
          - stack: newest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.15"
          python-version: ${{ matrix.python }}
      - run: uv build --wheel --out-dir dist
      - name: The ${{ matrix.stack }} stack, exactly from its lock, with the wheel
        run: |
          uv venv --no-project --python ${{ matrix.python }} env
          uv pip install --python env --require-hashes -r stack/${{ matrix.stack }}.txt
          uv pip install --python env --no-deps dist/*.whl
          uv pip check --python env
      - name: Checks in the stack
        working-directory: ${{ runner.temp }}
        run: |
          out="$GITHUB_WORKSPACE/artifacts/stack-${{ matrix.stack }}"
          py() { "$GITHUB_WORKSPACE/env/bin/python" -P "$@"; }
          py "$GITHUB_WORKSPACE/scripts/check_core_imports.py" --installed --integration demo --report "$out/imports.json"
          py -m ssrobot.conformance --out "$out/conformance"
          py -m ssrobot.demo --out "$out/demo"
          py "$GITHUB_WORKSPACE/examples/pick/pick.py" --out "$out/pick"
          py "$GITHUB_WORKSPACE/examples/pick/pick.py" --out "$out/pick-view" --view < /dev/null
          cmp "$out/pick/trace.jsonl" "$out/pick-view/trace.jsonl"
          py "$GITHUB_WORKSPACE/scripts/stack_report.py" --stack ${{ matrix.stack }} --wheel "$(echo $GITHUB_WORKSPACE/dist/*.whl)" --out "$out/stack-${{ matrix.stack }}.json" --check dependency-gate --check conformance --check demo --check pick --check pick-view
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stack-${{ matrix.stack }}
          path: artifacts/stack-${{ matrix.stack }}/
          if-no-files-found: error

  reference-robots:
    # Geodude and ADA, built from their pinned asset commits and inspected installed.
    runs-on: ubuntu-latest
    env:
      # ADA's wrist camera channels are confirmed only where MuJoCo can render.
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv builds and installs the reference wheels, so it is pinned here.
          version: "0.12.15"
          python-version: "3.11"
      - run: uv build --out-dir dist
      - name: The built ssrobot wheel, with the locked extras, in a clean environment
        run: |
          uv venv --no-project clean-reference
          uv export --locked --format requirements-txt --no-emit-project --extra mujoco --extra planning --group dev > "$RUNNER_TEMP/reference-requirements.txt"
          uv pip install --python clean-reference -r "$RUNNER_TEMP/reference-requirements.txt"
          uv pip install --python clean-reference --no-deps dist/*.whl
      - run: clean-reference/bin/python scripts/check_reference_robots.py --out artifacts/reference-robots --require-installed-ssrobot
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reference-robots
          path: artifacts/reference-robots/
          if-no-files-found: error
