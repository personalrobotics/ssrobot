name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # MuJoCo renders camera channels headless through OSMesa.
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/generate_schemas.py --check
      - run: uv run pytest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: m0-evidence-py${{ matrix.python }}
          path: artifacts/
          if-no-files-found: error

  installed:
    # Verifies the built wheel in an environment that has nothing else installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv build --out-dir dist
      - run: uv venv --no-project clean
      - run: uv pip install --python clean dist/*.whl
      - run: uv pip list --python clean
      - name: The installed wheel provides the ssrobot command
        run: clean/bin/ssrobot --help
      - name: Dependency gate on the installed wheel
        run: clean/bin/python scripts/check_core_imports.py --installed --report artifacts/installed-conformance/imports.json
      - name: The mujoco extra in its own clean environment
        run: |
          uv venv --no-project clean-mujoco
          uv pip install --python clean-mujoco "$(echo dist/*.whl)[mujoco]"
      - name: Dependency gate on the installed wheel with the mujoco extra
        run: clean-mujoco/bin/python scripts/check_core_imports.py --installed --integration mujoco --report artifacts/installed-conformance/imports-mujoco.json
      - name: MujocoRuntime runs the README trajectory from the installed wheel
        working-directory: ${{ github.workspace }}
        run: |
          sed -n '/^### Simulation in MuJoCo/,/^## /p' README.md | sed -n '/^```python$/,/^```$/p' | sed '1d;$d' > "$RUNNER_TEMP/readme_mujoco.py"
          clean-mujoco/bin/python -P "$RUNNER_TEMP/readme_mujoco.py" | tee "$RUNNER_TEMP/readme_mujoco.txt"
          grep -q '^succeeded ' "$RUNNER_TEMP/readme_mujoco.txt"
      - name: Without a display or MUJOCO_GL, camera channels are unconfirmed, not fatal
        working-directory: ${{ github.workspace }}
        run: >-
          clean-mujoco/bin/python -P -c "import ssrobot;
          from ssrobot.mujoco import MujocoRuntime;
          p = ssrobot.load_package('examples/packages/mujoco_arm');
          r = MujocoRuntime(p);
          ctx = ssrobot.RobotContext(p.description, r); ctx.__enter__();
          why = {b.name: b.unavailable.code for b in r.mapping.channels if b.unavailable};
          ctx.close(); print(why);
          assert why == {'wrist_rgb': 'rendering_unavailable', 'wrist_depth': 'rendering_unavailable'}, why"
      - name: Conformance from the installed wheel
        working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/clean/bin/python -m ssrobot.conformance --out $GITHUB_WORKSPACE/artifacts/installed-conformance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: installed-conformance
          path: artifacts/installed-conformance/
          if-no-files-found: error

  reference-robots:
    # Geodude and ADA, built from their pinned asset commits and inspected installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv builds and installs the reference wheels, so it is pinned here.
          version: "0.12.15"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run python scripts/check_reference_robots.py --out artifacts/reference-robots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reference-robots
          path: artifacts/reference-robots/
          if-no-files-found: error
